name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "main"
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  schedule:
    # Refresh generated Notion content and expiring assets every four hours.
    - cron: "0 */4 * * *"

  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate static pages
        run: npm i -g noblog@0.3.0-beta.3 && noblog generate --config ./noblog.yaml
        env:
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          NOBLOG_DATABASE_ID: ${{ secrets.NOBLOG_DATABASE_ID }}
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          package-manager: pnpm@12 # Match the lockfile and workspace configuration.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
